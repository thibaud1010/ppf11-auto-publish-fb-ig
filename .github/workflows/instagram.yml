name: IG - Ejercicios (07:00 y 18:00 Paris)

# Publica UN ejercicio en las 7 cuentas de Instagram, a las 07:00 y 18:00 de Paris.
# El script elige la franja (mañana/tarde) segun la hora de Paris y es IDEMPOTENTE
# (una vez por franja y dia). Disparo exacto por reloj externo (cron-job.org);
# estos cron de GitHub son red de seguridad y no duplican.
on:
  # DISPARO UNICO por reloj externo exacto (cron-job.org) via workflow_dispatch.
  # Se QUITARON los cron de GitHub: tener dos disparadores (cron-job.org + GitHub)
  # causaba publicaciones DUPLICADAS cuando una publicacion se creaba en IG pero
  # su respuesta fallaba. Un solo disparador por franja = imposible duplicar.
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar aunque ya se publicara esta franja hoy"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # MISMO grupo que FB: las 3 publicaciones escriben en state/ y antes corrian en
    # paralelo (FB :00 + IG :01) -> el push de IG perdia la carrera con FB y su estado
    # nunca se guardaba (rotacion IG congelada = duplicados). Mismo grupo = en serie.
    concurrency: publish-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Publicar ejercicio en todas las cuentas IG
        env:
          TOKENS_JSON: ${{ secrets.TOKENS_JSON }}
        run: python publish_instagram.py ${{ inputs.force && '--force' || '' }}
      - name: Guardar registro
        if: always()   # guardar el estado AUNQUE falle un idioma (evita rotacion congelada -> duplicados)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state/
          git commit -m "state: ig $(date -u +%FT%TZ)" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "reintento push $i"; sleep 5
          done
          echo "push fallo" >&2; exit 1
