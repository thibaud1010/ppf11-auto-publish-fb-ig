name: Reels - PPF11 (video FR -> IG+FB 6 idiomas) [WIP]

# BORRADOR / WIP. Solo disparo MANUAL (workflow_dispatch) y DRY-RUN por defecto.
# NO hay disparo automatico (ni cron de GitHub ni cron-job.org) hasta validar.
# Para activarlo de verdad:
#   1) crear un bucket PUBLICO en Supabase y los secretos SUPABASE_URL / SUPABASE_KEY (service_role) / SUPABASE_BUCKET
#   2) probar: Run workflow con publish=si y only=es (valida descarga FB + IG Reel)
#   3) (opcional) crear el disparo diario a mediodia en cron-job.org, como los otros.
on:
  workflow_dispatch:
    inputs:
      publish:
        # Comparacion de STRINGS (a prueba de balas via API): 'si' publica, vacio = solo simula.
        # Antes era un boolean 'dry_run' con el truco ternario ${{ x && '' || '--publish' }},
        # que en GitHub da '--publish' SIEMPRE (la rama vacia rompe el ternario) -> publicaba
        # aunque quisieras simular. Con string == 'si' el comportamiento es inequivoco.
        description: "Escribe 'si' para PUBLICAR de verdad (vacio = solo simular)"
        type: string
        default: ""
      only:
        description: "Solo un idioma (es/en/de/it/pt/nl), opcional"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Mismo grupo que FB/IG: todos escriben en state/ (guardado en serie + fusion).
    concurrency: publish-state
    steps:
      - uses: actions/checkout@v4
      - name: Partir del estado mas reciente
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Publicar reel (rotacion)
        env:
          TOKENS_JSON: ${{ secrets.TOKENS_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: python publish_reels.py ${{ inputs.publish == 'si' && '--publish' || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Guardar estado
        if: always()   # guardar el estado AUNQUE falle un idioma (evita rotacion congelada -> reels duplicados)
        # Guardado por FUSION (tools/merge_state.js) — ver instagram.yml.
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp -r state /tmp/state_ours
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            node tools/merge_state.js /tmp/state_ours state
            git add state/
            git commit -m "state: reels $(date -u +%FT%TZ)" || { echo "sin cambios"; exit 0; }
            git push origin main && exit 0
            echo "reintento push $i"; sleep 5
          done
          echo "push fallo" >&2; exit 1
