name: Reels - PPF11 (video FR -> IG+FB por idioma)

# EN VIVO. Disparo por reloj externo (cron-job.org, workflow_dispatch) a mediodia de
# Paris y de Bogota; el tick.yml tambien lo cubre cuando GitHub lo ejecuta.
# 2026-11-27: PUBLICA POR DEFECTO. Antes solo publicaba si el disparo mandaba
# publish=si; desde el 01/11 los disparos de cron-job.org llegaban SIN ese dato ->
# cada ejecucion era una simulacion "success" sin publicar nada (solo salian reels
# cuando un tick caia por casualidad en la franja). Para SIMULAR: simular=si.
# Sin riesgo de duplicados: cada idioma se marca por dia en state/published.json.
on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Escribe 'si' para SOLO SIMULAR (vacio = publica de verdad)"
        type: string
        default: ""
      publish:
        # OBSOLETO (se ignora): se mantiene para que los disparos antiguos de cron-job.org
        # que aun lo envian no fallen por input desconocido.
        description: "Obsoleto, se ignora"
        type: string
        default: ""
      only:
        description: "Solo un idioma (es/en/de/it/pt/nl/el/pl), opcional"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Mismo grupo que FB/IG: todos escriben en state/ (guardado en serie + fusion).
    concurrency: publish-state
    steps:
      - uses: actions/checkout@v4
      - name: Partir del estado mas reciente
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: ffmpeg (variante con rotulo, flag reels_variant)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: sudo apt-get install -y -qq fonts-dejavu-core || true
      - name: Publicar reel (rotacion)
        env:
          TOKENS_JSON: ${{ secrets.TOKENS_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: python publish_reels.py ${{ inputs.simular != 'si' && '--publish' || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Guardar estado
        if: always()   # guardar el estado AUNQUE falle un idioma (evita rotacion congelada -> reels duplicados)
        # Guardado por FUSION (tools/merge_state.js) — ver instagram.yml.
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp -r state /tmp/state_ours
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            node tools/merge_state.js /tmp/state_ours state
            git add state/
            git commit -m "state: reels $(date -u +%FT%TZ)" || { echo "sin cambios"; exit 0; }
            git push origin main && exit 0
            echo "reintento push $i"; sleep 5
          done
          echo "push fallo" >&2; exit 1
