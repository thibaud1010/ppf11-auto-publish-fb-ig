name: FB - Articulo del blog (07:00 Paris)

# Publica UN articulo del blog en las 7 Paginas, a las 07:00 hora de Paris.
# El disparo EXACTO lo da un reloj externo (cron-job.org) via workflow_dispatch.
# Estos cron de GitHub son SOLO RED DE SEGURIDAD (por si el reloj externo fallara);
# como el script es IDEMPOTENTE (publica una sola vez por franja y dia), disparar
# varias veces NO duplica. Se cubre una ventana amplia por si GitHub retrasa el cron.
on:
  # DISPARO UNICO por reloj externo exacto (cron-job.org) via workflow_dispatch.
  # Se QUITARON los cron de GitHub para evitar doble disparo (que causaba duplicados).
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar aunque ya se publicara hoy"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # MISMO grupo que IG y FB-ejercicio: escriben en state/ y no deben pushear a la vez
    # (la carrera de push congelaba la rotacion de IG -> duplicados). Mismo grupo = en serie.
    concurrency: publish-state
    steps:
      - uses: actions/checkout@v4
      # El checkout ancla al SHA del DISPARO (:00): partimos SIEMPRE del main real
      # para leer el estado/rotacion mas reciente (evita duplicados).
      - name: Partir del estado mas reciente
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Publicar articulo en todas las Paginas
        env:
          TOKENS_JSON: ${{ secrets.TOKENS_JSON }}
        run: python publish_facebook.py --type article ${{ inputs.force && '--force' || '' }}
      - name: Guardar registro
        if: always()   # guardar el estado AUNQUE falle un idioma (evita rotacion congelada -> duplicados)
        # Guardado por FUSION (tools/merge_state.js): el "pull --rebase" del segundo
        # en guardar chocaba en history.jsonl y el estado se perdia (fb:articles
        # estuvo 4 dias sin guardar -> mismo articulo repetido). Fusionar no conflictua.
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp -r state /tmp/state_ours
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            node tools/merge_state.js /tmp/state_ours state
            git add state/
            git commit -m "state: fb article $(date -u +%FT%TZ)" || { echo "sin cambios"; exit 0; }
            git push origin main && exit 0
            echo "reintento push $i"; sleep 5
          done
          echo "push fallo" >&2; exit 1
